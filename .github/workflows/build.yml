
      - name: Install devkitPro tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
          curl -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0.0.0" \
            -o install-devkitpro-pacman \
            https://apt.devkitpro.org/install-devkitpro-pacman
          test -s install-devkitpro-pacman
          head -n 5 install-devkitpro-pacman
          chmod +x install-devkitpro-pacman
          sudo ./install-devkitpro-pacman
          sudo dkp-pacman -Syu --noconfirm nds-dev
